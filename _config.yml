# Site settings. Restart `jekyll serve` after editing this file.
title       : "Kuo Li"
description : "Kuo Li builds systems for intelligent models: LLM inference, GPU kernels, compilers, and agent infrastructure. Incoming Ph.D. student at Tsinghua University."
locale      : "en-US"
repository  : "Zlatanwic/acad-homepage.github.io"
url         : "https://zlatanwic.github.io"
baseurl     : "/acad-homepage.github.io"

# Optional services (leave empty to disable)
google_analytics_id      :
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

author:
  name            : "Kuo Li"
  avatar          : "/images/kuo-li-profile.jpg"
  location        : "Shanghai, China"
  email           : "2353113@tongji.edu.cn"
  email_secondary : "rodebiau9320@gmail.com"
  github          : "Zlatanwic"

# Reading files
include:
  - _pages
  - files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - run_server.sh
  - docs
  - google_scholar_crawler
  - .github
  - .sass-cache
  - .jekyll-cache
  - .playwright-mcp
  - assets/js/src
  - tools
  - node_modules
  - tmp
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  # Markdown blog posts (drafts are never published by default).
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      blog: true
      lang: en
      permalink: /blog/:year/:month/:day/:title/

sass:
  sass_dir: _sass
  style: compressed
  # Dart Sass (local Jekyll 4) only; GitHub Pages' converter ignores this key.
  silence_deprecations: [import]

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
