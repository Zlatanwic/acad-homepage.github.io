<aside class="dossier-index">
  <div class="dossier-index-head"><span class="dossier-label">ARCHIVE DIRECTORY</span><span class="dossier-label" aria-hidden="true">[ 06 ]</span></div>
  <nav id="site-nav" class="dossier-navigation" aria-label="Archive navigation">
    {% for entry in site.data.archive %}
    <a href="{{ entry.url | relative_url }}"{% if page.archive_id == entry.id or page.blog and entry.id == 'blog' %} aria-current="page"{% endif %}><span class="dossier-nav-number">{{ entry.number }}</span><span>{{ entry.title | escape }}<small>{{ entry.detail | escape }}</small></span><span class="dossier-nav-arrow" aria-hidden="true">↗</span></a>
    {% endfor %}
  </nav>
  <div class="dossier-index-note"><div class="dossier-orbit-mini" aria-hidden="true"><i></i><i></i><i></i><span>KL</span></div><span class="dossier-label">RESEARCH / BUILD / EXPLORE</span><p>Curiosity,<br>down to the metal.</p><a href="{{ '/profile/#contact' | relative_url }}">Open a channel <span aria-hidden="true">↗</span></a></div>
</aside>
