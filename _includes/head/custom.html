<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/stadium-icon-180.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/stadium-icon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/stadium-icon-16.png' | relative_url }}">
<link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}">

<meta name="theme-color" content="#ffffff">

<script>
  (function () {
    var root = document.documentElement;
    var theme = null;
    var lang = 'en';
    try {
      theme = localStorage.getItem('kl-theme');
      if (localStorage.getItem('kl-lang') === 'zh') lang = 'zh';
    } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', theme);
    root.setAttribute('data-lang', lang);
    root.style.setProperty('--gbg', theme === 'dark' ? '#030711' : '#ffffff');
  })();
</script>

{% if page.mathjax %}
<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
{% endif %}

<!-- end custom head snippets -->
