<!doctype html>
<html lang="{{ page.lang | default: 'en' | escape }}" class="no-js" data-motion="off">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body class="dossier-site blog-site">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include dossier-header.html %}
    <div class="dossier-shell">
      {% include dossier-nav.html %}
      <main id="main" class="dossier-main blog-main" tabindex="-1">{{ content }}{% include dossier-footer.html %}</main>
    </div>
    <!-- Independent reading pages never load a scroll-driven homepage scene. -->
    <script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
    {% include analytics.html %}
  </body>
</html>
