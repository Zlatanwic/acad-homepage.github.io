{% comment %}Decorative vector instrument. No telemetry, canvas, or animation runtime.{% endcomment %}
<svg class="dossier-emblem" viewBox="0 0 280 240" fill="none" aria-hidden="true" focusable="false">
  <g class="dossier-emblem-grid" stroke="currentColor" stroke-width=".7">
    <path d="M20 40H260M20 80H260M20 120H260M20 160H260M20 200H260M60 20V220M100 20V220M140 20V220M180 20V220M220 20V220"/>
    <circle cx="140" cy="120" r="99" stroke-dasharray="2 6"/>
    <path d="M8 65V8H65M215 8H272V65M272 175V232H215M65 232H8V175"/>
  </g>
  <g class="dossier-emblem-ring" stroke="currentColor">
    <circle cx="140" cy="120" r="83" stroke-dasharray="112 19 50 80" stroke-width="2"/>
    <path d="M140 24V36M140 204V216M44 120H56M224 120H236" stroke-width="3"/>
    <circle cx="140" cy="120" r="72"/>
  </g>
  <g class="dossier-emblem-core" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    {% case include.kind %}
    {% when 'profile' %}
    <path d="M140 60L188 88V150L140 178L92 150V88Z"/><circle cx="140" cy="105" r="19"/><path d="M107 153V143C107 117 173 117 173 143V153M124 68V56M156 68V56M83 104H71M197 104H209"/>
    {% when 'research' %}
    <path d="M140 58L194 89V151L140 182L86 151V89ZM140 58V120M86 89L140 120L194 89M140 120V182M86 151L140 120L194 151"/><path d="M140 82L173 101V139L140 158L107 139V101Z"/>
    {% when 'education' %}
    <ellipse cx="140" cy="120" rx="57" ry="24" transform="rotate(-35 140 120)"/><ellipse cx="140" cy="120" rx="57" ry="24" transform="rotate(35 140 120)"/><path d="M140 64V176M90 120H190"/><circle cx="140" cy="120" r="9"/><circle cx="185" cy="90" r="6" fill="currentColor"/>
    {% when 'projects' %}
    <path d="M140 62L193 89L140 116L87 89ZM87 115L140 142L193 115M87 141L140 168L193 141M87 89V141M193 89V141M140 116V168"/><path d="M116 89L140 77L164 89L140 101Z"/>
    {% when 'interests' %}
    <circle cx="140" cy="120" r="45"/><ellipse cx="140" cy="120" rx="23" ry="45"/><path d="M95 120H185M103 96H177M103 144H177"/><ellipse cx="140" cy="120" rx="63" ry="17" transform="rotate(-30 140 120)"/>
    {% else %}
    <path d="M105 68H160L177 85V172H105ZM160 68V85H177M119 106H161M119 119H161M119 132H151M119 145H141"/><path d="M94 81H84V185H161V179"/>
    {% endcase %}
  </g>
  <g fill="currentColor"><rect x="6" y="6" width="4" height="4"/><rect x="270" y="230" width="4" height="4"/><circle cx="41" cy="120" r="3"/><circle cx="239" cy="120" r="3"/></g>
</svg>
