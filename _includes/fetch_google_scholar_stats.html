<script>
(function () {
  {% if site.google_scholar_stats_use_cdn %}
  var source = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
  {% else %}
  var source = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
  {% endif %}
  // Citation data is optional; only fetch it when the page has citation fields.
  var total = document.getElementById('total_cit');
  var papers = document.querySelectorAll('.show_paper_citations');
  if (!total && !papers.length) return;
  fetch(source).then(function (response) {
    if (!response.ok) throw new Error('Citation data unavailable');
    return response.json();
  }).then(function (data) {
    if (total && data.citedby != null) total.textContent = data.citedby;
    papers.forEach(function (element) {
      var paper = (data.publications || {})[element.getAttribute('data')];
      if (paper && paper.num_citations != null) element.textContent = '| Citations: ' + paper.num_citations;
    });
  }).catch(function () {
    // Keep the existing citation text when data cannot be fetched.
  });
})();
</script>
