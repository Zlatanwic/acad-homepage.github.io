<header class="masthead">
  <nav id="site-nav" class="site-navigation" aria-label="Main navigation">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Kuo Li — Home">
      <span class="site-brand__mark" aria-hidden="true">KL<span>.</span></span>
      <span class="site-brand__label">Academic homepage</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
      <span>Menu</span><span class="nav-toggle__icon" aria-hidden="true"></span>
    </button>
    <ul id="nav-links" class="nav-links">
      {% for link in site.data.navigation.main %}
        {% assign link_start = link.url | slice: 0, 1 %}
        <li><a href="{% if link_start == '#' %}{% unless page.url == '/' %}{{ '/' | relative_url }}{% endunless %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if link.url == '/blog/' and page.blog %} class="is-active" aria-current="page"{% endif %}>{{ link.title | escape }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
