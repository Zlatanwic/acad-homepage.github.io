<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/stadium-icon-180.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/stadium-icon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/stadium-icon-16.png' | relative_url }}">
<link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}">

<meta name="msapplication-TileColor" content="#000000">
<meta name="theme-color" content="#081a32">
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>

{% if page.mathjax %}
<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
{% endif %}

<!-- end custom head snippets -->
