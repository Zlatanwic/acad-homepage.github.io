name: Get Citation Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    steps:
      - name: Check Scholar configuration
        id: scholar
        shell: bash
        run: |
          if [[ -z "${GOOGLE_SCHOLAR_ID}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GOOGLE_SCHOLAR_ID is not configured; citation update skipped."
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        if: steps.scholar.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.scholar.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install requirements
        if: steps.scholar.outputs.enabled == 'true'
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch and publish citation data
        if: steps.scholar.outputs.enabled == 'true'
        shell: bash
        run: |
          cd google_scholar_crawler
          python main.py
          cd results
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.json'
          git commit -m "Updated Citation Data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:google-scholar-stats --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
